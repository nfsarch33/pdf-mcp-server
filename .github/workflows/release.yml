name: Release

# Tag-based release workflow.
# Triggers when an annotated tag matching v*.*.* is pushed.
# Runs tests as a gate, validates version consistency, then creates/updates
# a GitHub Release with notes extracted from CHANGELOG.md.
#
# Pattern: tag push -> test gate -> version gate -> GitHub Release + GHCR image
# See: docs/release-sop.md for the maintainer-side step-by-step SOP.

on:
  push:
    tags:
      - "v*.*.*"   # semantic version tags only

permissions:
  contents: write      # create/update releases

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false   # never cancel an in-progress release

jobs:
  # Gate 1: Run the full test suite on the tagged commit
  test-gate:
    name: Test gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Run tests
        run: make test

  # Gate 2: Validate tag matches pyproject.toml and CHANGELOG exists
  version-gate:
    name: Version gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate release readiness
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: python scripts/check_release_ready.py

  # Create GitHub Release (only after both gates pass)
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [test-gate, version-gate]
    steps:
      - uses: actions/checkout@v4

      - name: Create/Update GitHub Release from CHANGELOG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: python scripts/create_github_release_from_changelog.py

  # Publish the container image (only after both gates pass)
  publish-image:
    name: Publish image to GHCR
    runs-on: ubuntu-latest
    needs: [test-gate, version-gate]
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/nfsarch33/pdf-mcp-server:${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: podman build -t "$IMAGE" .

      - name: Smoke test (57 tools over stdio)
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | (cat; sleep 5) | timeout 60 podman run -i --rm "$IMAGE" \
            | python3 -c 'import sys,json; n=[len(m["result"]["tools"]) for m in map(json.loads, sys.stdin) if m.get("id")==2]; print(n); sys.exit(0 if n==[57] else 1)'

      - name: Push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          podman push "$IMAGE"
