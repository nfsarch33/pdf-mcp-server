name: Secret scan (gitleaks)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned, no Actions cache upload)
        run: |
          set -euo pipefail
          version="8.30.1"
          tarball="gitleaks_${version}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${version}/${tarball}"
          curl --location --fail --silent --show-error --output "${tarball}" "${url}"
          tar -xzf "${tarball}" gitleaks
          chmod +x gitleaks
          ./gitleaks version
      - name: Scan git history with gitleaks
        run: ./gitleaks detect --redact --verbose --config .gitleaks.toml

  deny-pattern:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for maintainer-private references
        run: bash scripts/ci/deny-pattern.sh

